<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rank and Rank Criterion · Lerntools Quantitative Methoden</title>
  <link rel="stylesheet" href="quiz.css">
<style>
    .site-back-wrap {
      width:min(980px,calc(100% - 32px));
      margin:0 auto;
      padding:18px 0 0;
    }
    .site-back-link {
      display:inline-block;
      padding:6px 9px;
      border:1px solid transparent;
      border-radius:6px;
      color:#2E6F9E !important;
      text-decoration:none !important;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:15px;
      font-weight:500;
      transition:border-color .15s ease,box-shadow .15s ease;
    }
    .site-back-link:hover,
    .site-back-link:focus-visible {
      border-color:#2E6F9E;
      box-shadow:0 0 0 1px #2E6F9E;
      outline:none;
    }
  </style>
</head>
<body class="app-module">
  <div class="site-back-wrap">
    <a class="site-back-link" href="../../../mathematik/">← Mathematik, Bachelor-Modul</a>
  </div>
  <main class="module-shell">
    <div class="module-heading">
      <span class="module-category">Matrix Algebra</span>
      <h1>Rank and Rank Criterion</h1>
    </div>

    <section class="lab-card rank-quiz" aria-label="Quiz on rank and the rank criterion">
      <div class="rank-toolbar">
        <div class="rank-example-badge" id="exampleBadge"></div>
        <div class="rank-toolbar-actions">
          <button type="button" class="secondary-button" id="restartButton">Restart example</button>
          <button type="button" id="newExampleButton">New example</button>
        </div>
      </div>
      <div class="rank-status" id="statusLine" aria-live="polite"></div>
      <div class="rank-stage" id="rankStage" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer">Sebastian Schlütter · Hochschule Mainz</footer>
  <script src="app.js"></script>

</html>
