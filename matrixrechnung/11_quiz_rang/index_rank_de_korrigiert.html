<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rang und Rangkriterium – Lerntools zum Bachelor-Modul Mathematik</title>
  <link rel="stylesheet" href="../shared/quiz.css">
</head>
<body class="app-module">
  <header class="site-header">
    <div class="site-header-inner">
      <span class="site-title">Lerntools zum Bachelor-Modul Mathematik</span>
    </div>
  </header>

  <main class="module-shell">
    <div class="module-heading">
      <span class="module-category">Matrixrechnung</span>
      <h1>Rang und Rangkriterium</h1>
    </div>

    <section class="lab-card rank-quiz" aria-label="Quiz zu Rang und Rangkriterium">
      <div class="rank-toolbar">
        <div class="rank-example-badge" id="exampleBadge"></div>
        <div class="rank-toolbar-actions">
          <button type="button" class="secondary-button" id="restartButton">Beispiel neu starten</button>
          <button type="button" id="newExampleButton">Neues Beispiel</button>
        </div>
      </div>
      <div class="rank-status" id="statusLine" aria-live="polite"></div>
      <div class="rank-stage" id="rankStage" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">Sebastian Schlütter · Hochschule Mainz</footer>
  <script src="../shared/app.js"></script>
</body>
</html>
