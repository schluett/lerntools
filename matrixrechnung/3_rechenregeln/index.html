<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rechnen mit Matrizen · Lerntools Quantitative Methoden</title>
  <style>
    :root { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#20242A; background:#F7F8FA; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { max-width:1050px; margin:0 auto; padding:32px 22px 60px; }
    .back { display:inline-block; margin-bottom:22px; padding:6px 9px; border:1px solid transparent; border-radius:6px; color:#2E6F9E; text-decoration:none; transition:border-color .15s ease, box-shadow .15s ease; }
    .back:hover, .back:focus-visible { border-color:#2E6F9E; box-shadow:0 0 0 1px #2E6F9E; outline:none; }
    h1 { margin:0 0 6px; font-size:clamp(28px,4vw,42px); }
    .subtitle { margin:0 0 24px; color:#68707C; font-size:18px; }
    video { width:100%; background:#111; border-radius:8px; }
    .chapters { margin-top:30px; }
    .chapter { width:100%; display:flex; gap:16px; align-items:center; padding:12px 14px; margin:7px 0; border:1px solid #D8DDE5; border-radius:7px; background:white; color:#20242A; text-align:left; cursor:pointer; font-size:16px; transition:border-color .15s ease, box-shadow .15s ease; }
    .chapter:hover, .chapter:focus-visible { border-color:#2E6F9E; box-shadow:0 0 0 1px #2E6F9E; outline:none; }
    .time { min-width:58px; font-variant-numeric:tabular-nums; color:#2E6F9E; font-weight:650; }
    .muted { color:#68707C; }
    .warning { padding:18px; background:#fff4d8; border:1px solid #ead49b; border-radius:8px; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../../mathematik/">← Mathematik, Bachelor-Modul</a>
    <h1>Rechnen mit Matrizen</h1>
    <p class="subtitle">Summe, Differenz und Vielfaches</p>
    <video id="player" controls preload="metadata">
          <source src="https://seafile.rlp.net/seafhttp/f/a3a934556cc64b558bfd/?op=view" type="video/mp4">
          
          Ihr Browser kann dieses Video nicht abspielen.
        </video>
    <section class="chapters"><h2>Kapitel</h2><button class="chapter" data-start="0.000"><span class="time">00:00</span><span>Einführung und Addition</span></button>
<button class="chapter" data-start="107.195"><span class="time">01:47</span><span>Voraussetzungen der Addition</span></button>
<button class="chapter" data-start="166.854"><span class="time">02:47</span><span>Subtraktion und Skalarmultiplikation</span></button>
<button class="chapter" data-start="292.686"><span class="time">04:53</span><span>Zwei Rechenwege</span></button>
<button class="chapter" data-start="405.716"><span class="time">06:46</span><span>Das Distributivgesetz</span></button>
<button class="chapter" data-start="476.412"><span class="time">07:56</span><span>Fazit</span></button></section>
  </main>
  <script>
    const player = document.getElementById("player");
    for (const button of document.querySelectorAll(".chapter")) {
      button.addEventListener("click", () => {
        if (!player || !player.querySelector("source")) return;
        player.currentTime = Number(button.dataset.start);
        player.play().catch(() => {});
      });
    }
  </script>
</body>
</html>
