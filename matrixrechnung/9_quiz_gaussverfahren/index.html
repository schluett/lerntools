<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gaußverfahren · Lerntools Quantitative Methoden</title>
  <link rel="stylesheet" href="quiz.css">
<style>
    .site-back-wrap {
      width:min(980px,calc(100% - 32px));
      margin:0 auto;
      padding:18px 0 0;
    }
    .site-back-link {
      display:inline-block;
      padding:6px 9px;
      border:1px solid transparent;
      border-radius:6px;
      color:#2E6F9E !important;
      text-decoration:none !important;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-size:15px;
      font-weight:500;
      transition:border-color .15s ease,box-shadow .15s ease;
    }
    .site-back-link:hover,
    .site-back-link:focus-visible {
      border-color:#2E6F9E;
      box-shadow:0 0 0 1px #2E6F9E;
      outline:none;
    }
  </style>
</head>
<body class="app-module">
  <div class="site-back-wrap">
    <a class="site-back-link" href="../../mathematik/">← Mathematik, Bachelor-Modul</a>
  </div>
  <main class="module-shell">
    <div class="module-heading">
      <span class="module-category">Matrixrechnung</span>
      <h1>Gaußverfahren</h1>
    </div>

    <section class="lab-card gauss-quiz" aria-label="Quiz zum Gaußverfahren">
      <div class="gauss-quiz-toolbar">
        <div class="gauss-view-switch" role="group" aria-label="Darstellung wählen">
          <button type="button" class="view-button is-selected" id="equationViewButton">Gleichungssystem</button>
          <button type="button" class="view-button" id="matrixViewButton">Matrixform</button>
        </div>
        <div class="gauss-toolbar-actions">
          <button type="button" class="gauss-back-button" id="backButton" disabled>Zurück</button>
          <button type="button" class="gauss-reset-button" id="restartButton">Neu starten</button>
        </div>
      </div>

      <div class="gauss-quiz-status" id="statusLine" aria-live="polite"></div>
      <div class="gauss-quiz-stage" id="gaussStage" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer">Sebastian Schlütter · Hochschule Mainz</footer>
  <script src="app.js"></script>
</body>
</html>
