  <style>
    :root { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#20242A; background:#F7F8FA; }

    body { margin:0; }

.language-switch {
  position:fixed;
  top:14px;
  right:18px;
  z-index:1000;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px 9px;
  background:rgba(255,255,255,.96);
  border:1px solid #D8DDE5;
  border-radius:7px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;
}
.language-switch a {
  min-width:28px;
  padding:4px 5px;
  border:1px solid transparent;
  border-radius:5px;
  color:#2E6F9E !important;
  text-align:center;
  text-decoration:none !important;
  font-weight:650;
}
.language-switch a:hover,
.language-switch a:focus-visible {
  border-color:#2E6F9E;
  box-shadow:0 0 0 1px #2E6F9E;
  outline:none;
}
.language-switch a.current {
  color:#20242A !important;
  background:#EEF3F7;
  pointer-events:none;
}
